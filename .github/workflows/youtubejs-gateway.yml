name: YouTube.js gateway

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/youtubejs-gateway/**'
      - '.github/workflows/youtubejs-gateway.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build experimental gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/youtubejs-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install gateway dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck gateway
        run: npm run typecheck
      - name: Build staging gateway without deploying
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --env staging
