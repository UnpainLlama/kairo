name: Build and deploy KAIRO

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy after the checks pass'
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

concurrency:
  group: kairo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Verify staging and production Access configuration
        run: node scripts/validate-wrangler-access.mjs
      - name: Report dependency security advisories
        run: |
          npm audit --json > npm-audit-all.json || true
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          production_audit_status=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function printAudit(file, label) {
            let report = {};
            try { report = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
            const entries = Object.entries(report.vulnerabilities ?? {});
            console.log(label + ': ' + (entries.length === 0 ? 'no reported vulnerabilities' : entries.length + ' affected packages'));
            for (const [name, item] of entries) {
              console.log(`- ${name}: severity=${item.severity}, direct=${item.isDirect}, range=${item.range}, paths=${(item.nodes ?? []).join(',')}, fixAvailable=${JSON.stringify(item.fixAvailable)}`);
              for (const advisory of item.via ?? []) {
                if (typeof advisory === 'string') console.log(`  - dependency: ${advisory}`);
                else console.log(`  - ${advisory.title ?? advisory.name ?? 'Advisory'}: ${advisory.url ?? ''} (range: ${advisory.range ?? 'unspecified'})`);
              }
            }
          }
          printAudit('npm-audit-production.json', 'Production dependency audit (dev dependencies omitted)');
          printAudit('npm-audit-all.json', 'Full dependency audit');
          NODE
          if [ "$production_audit_status" -ne 0 ]; then
            echo "::error::Production dependency audit failed. Resolve production dependency advisories before this change can pass CI."
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # One deploy job for both targets. Staging is the default; production is double-gated (see the guard step).
  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DEPLOY_APPROVED: ${{ vars.PRODUCTION_DEPLOY_APPROVED }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Guard - manual staging deploys must use the reconciled staging branch
        if: github.event_name == 'workflow_dispatch' && env.TARGET == 'staging'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/staging" ]; then
            echo "::error::Manual staging deploys must be dispatched from the reconciled 'staging' branch. Do not deploy feature branches directly."
            exit 1
          fi
      - name: Guard - production needs explicit approval
        if: env.TARGET == 'production'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Production deploys only run from main."; exit 1; fi
          if [ "$PRODUCTION_DEPLOY_APPROVED" != "true" ]; then
            echo "::error::Production deploy is not approved. The owner must set the repository variable PRODUCTION_DEPLOY_APPROVED=true."; exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
      - name: Guard - Cloudflare credentials and resource IDs
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing in the '$TARGET' GitHub environment. See docs/DEPLOYMENT.md."; exit 1
          fi
          WANT=$(echo "$TARGET" | tr a-z A-Z)
          if grep -q "REPLACE_WITH_${WANT}_" wrangler.jsonc; then
            echo "::error file=wrangler.jsonc::Replace the REPLACE_WITH_${WANT}_... placeholders with your real Cloudflare IDs. See docs/DEPLOYMENT.md."; exit 1
          fi
          if grep -Eq "REPLACE_WITH_${WANT}_ACCESS_(TEAM_DOMAIN|AUD)" wrangler.jsonc; then
            echo "::error file=wrangler.jsonc::Set the ${TARGET} ACCESS_TEAM_DOMAIN and ACCESS_AUD from that environment's Kairo Access application before deploying."; exit 1
          fi
          node scripts/validate-wrangler-access.mjs --require-values
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Migrations are additive-only, so the previous Worker keeps working against the new schema while the deploy happens.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      - name: Build for the target environment
        run: CLOUDFLARE_ENV="$TARGET" npm run build
      - name: Deploy Worker and static assets
        run: CLOUDFLARE_ENV="$TARGET" npx wrangler deploy 2>&1 | tee deploy.log
      - name: Verify health endpoints or confirm Cloudflare Access protection
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+[.]workers[.]dev' deploy.log | head -1 || true)
          if [ "$TARGET" = "production" ]; then
            URL="${URL:-$PRODUCTION_URL}"
          else
            URL="${URL:-$STAGING_URL}"
          fi
          if [ -z "$URL" ]; then echo "::error::Could not find the deployed URL in the deploy log. Set the repository variable STAGING_URL."; exit 1; fi

          echo "Checking $URL"
          RESULTS=""
          REMOTE_ACCESS_INTERCEPTED=0
          for path in /api/health /api/ready; do
            probe_result=""
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS --connect-timeout 15 --max-time 30 -D probe-headers.txt -o probe-body.json -w '%{http_code}' "$URL$path" || true)
              location=$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' probe-headers.txt 2>/dev/null | head -1 | tr -d '\r' || true)

              if [ "$code" = "200" ] && jq -e '.success == true' probe-body.json >/dev/null 2>&1; then
                probe_result="HTTP 200 - Worker returned JSON"
                echo "$path OK: $probe_result"
                break
              fi

              # Access protects the whole Worker unless exact path overrides are configured.
              # A 302 to the account Access login is an expected protected response, not a Worker failure.
              if [ "$code" = "302" ] && printf '%s' "$location" | grep -Eiq '^https://[^/]+[.]cloudflareaccess[.]com/cdn-cgi/access/login([/?]|$)'; then
                probe_result="HTTP 302 - Cloudflare Access login (protected)"
                REMOTE_ACCESS_INTERCEPTED=1
                echo "::notice::$URL$path is intercepted by Cloudflare Access; the unauthenticated Worker response cannot be inspected."
                break
              fi

              echo "$path -> HTTP ${code:-request-failed} (attempt $i), retrying in 10s"
              sleep 10
            done

            if [ -z "$probe_result" ]; then
              echo "::error::$URL$path returned neither a successful Worker JSON response nor a verified Cloudflare Access login redirect."
              cat probe-body.json 2>/dev/null || true
              exit 1
            fi
            RESULTS="$RESULTS| $path | $probe_result |"$'\n'
          done

          {
            echo "### Deployed $TARGET"
            echo "$URL"
            echo
            echo "| Endpoint | Verification |"
            echo "|---|---|"
            printf '%b' "$RESULTS"
            if [ "$REMOTE_ACCESS_INTERCEPTED" = "1" ]; then
              echo
              echo "> Cloudflare Access intercepted at least one unauthenticated probe. This confirms edge protection is active; it does not claim the live Worker handler or D1 readiness response was inspected. The Worker endpoint contracts and D1 readiness logic are tested in CI using test bindings, and the remote D1 migrations were applied earlier in this workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
