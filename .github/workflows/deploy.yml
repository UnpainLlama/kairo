name: Build and deploy KAIRO

on:
  pull_request:
    branches: [main, youtube, feat/youtube-video-search]
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy after the checks pass'
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

concurrency:
  group: kairo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # One deploy job for both targets. Staging is the default; production is double-gated (see the guard step).
  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'staging' || inputs.target == 'production'))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard - production needs explicit approval
        if: env.TARGET == 'production'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "::error::Production deploys only run from main."; exit 1; fi
          if [ "${{ vars.PRODUCTION_DEPLOY_APPROVED }}" != "true" ]; then
            echo "::error::Production deploy is not approved. The owner must set the repository variable PRODUCTION_DEPLOY_APPROVED=true."; exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v6
      - name: Guard - Cloudflare credentials and resource IDs
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing in the '$TARGET' GitHub environment. See docs/DEPLOYMENT.md."; exit 1
          fi
          WANT=$(echo "$TARGET" | tr a-z A-Z)
          if grep -q "REPLACE_WITH_${WANT}_" wrangler.jsonc; then
            echo "::error file=wrangler.jsonc::Replace the REPLACE_WITH_${WANT}_... placeholders with your real Cloudflare IDs. See docs/DEPLOYMENT.md."; exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Migrations are additive-only, so the previous Worker keeps working against the new schema while the deploy happens.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      - name: Build for the target environment
        run: CLOUDFLARE_ENV="$TARGET" npm run build
      - name: Deploy Worker and static assets
        run: CLOUDFLARE_ENV="$TARGET" npx wrangler deploy 2>&1 | tee deploy.log
      - name: Verify health and database connectivity
        run: |
          URL=$(grep -o 'https://[A-Za-z0-9._-]*\.workers\.dev' deploy.log | head -1 || true)
          URL="${URL:-${{ vars.STAGING_URL }}}"
          if [ -z "$URL" ]; then echo "::error::Could not find the deployed URL in the deploy log. Set the repository variable STAGING_URL."; exit 1; fi
          echo "Checking $URL"
          for path in /api/health /api/ready; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o body.json -w '%{http_code}' "$URL$path" || true)
              if [ "$code" = "200" ] && grep -q '"success":true' body.json; then ok=1; break; fi
              echo "$path -> HTTP $code (attempt $i), retrying in 10s"; sleep 10
            done
            if [ "$ok" != "1" ]; then echo "::error::$URL$path did not return a healthy response."; cat body.json; exit 1; fi
            echo "$path OK: $(cat body.json)"
          done
          if [ "$TARGET" = "staging" ]; then
            echo "Checking the independent TMDB movie and TV catalogue..."
            for media in movie tv; do
              path="/api/v1/movies/experience/feed?kind=popular&media_type=$media&page=1"
              code=$(curl -s -o "$media-feed.json" -w '%{http_code}' "$URL$path" || true)
              if [ "$code" != "200" ] || ! node -e "const p=require('./$media-feed.json');process.exit(p.success&&Array.isArray(p.data?.results)&&p.data.results.length>0?0:1)"; then
                echo "::error::TMDB $media feed failed (HTTP $code)."; cat "$media-feed.json"; exit 1
              fi
              echo "TMDB $media feed OK"
            done
            MOVIE_ID=$(node -e "const p=require('./movie-feed.json');process.stdout.write(String(p.data.results[0].id))")
            TV_ID=$(node -e "const p=require('./tv-feed.json');process.stdout.write(String(p.data.results[0].id))")
            for path in "/api/v1/movies/experience/detail/movie/$MOVIE_ID" "/api/v1/movies/experience/movie/$MOVIE_ID/videos" "/api/v1/movies/experience/movie/$MOVIE_ID/images" "/api/v1/movies/experience/detail/tv/$TV_ID" "/api/v1/movies/experience/tv/$TV_ID/seasons" "/api/v1/movies/experience/people/popular?page=1" "/api/v1/movies/experience/search?q=The%20Matrix&media_type=multi&page=1"; do
              code=$(curl -s -o smoke.json -w '%{http_code}' "$URL$path" || true)
              if [ "$code" != "200" ] || ! node -e "const p=require('./smoke.json');process.exit(p.success&&p.data&&typeof p.data==='object'?0:1)"; then
                echo "::error::TMDB experience endpoint failed: $path (HTTP $code)."; cat smoke.json; exit 1
              fi
              echo "TMDB endpoint OK: $path"
            done
            TV_DETAIL=$(curl -fsS "$URL/api/v1/movies/experience/detail/tv/$TV_ID")
            SEASON=$(printf '%s' "$TV_DETAIL" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const v=(p.data.seasons||[]).find(x=>x.season_number>0)||(p.data.seasons||[])[0];process.stdout.write(v?String(v.season_number):'')})")
            if [ -n "$SEASON" ]; then
              path="/api/v1/movies/experience/tv/$TV_ID/seasons/$SEASON"
              code=$(curl -s -o smoke.json -w '%{http_code}' "$URL$path" || true)
              if [ "$code" != "200" ] || ! node -e "const p=require('./smoke.json');process.exit(p.success&&Array.isArray(p.data?.episodes)?0:1)"; then
                echo "::error::TMDB TV episodes endpoint failed: $path (HTTP $code)."; cat smoke.json; exit 1
              fi
              echo "TMDB TV episodes OK"
            fi
            echo "TMDB catalogue smoke checks passed."
          fi
          grep -q '"cache":"kv"' body.json || echo "::warning::The KV cache binding is not active (ready reports cache != kv)."
          { echo "### Deployed $TARGET"; echo "$URL"; echo; echo '```json'; cat body.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
