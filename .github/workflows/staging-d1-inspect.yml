name: Inspect staging D1 migrations (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-d1-inspect.yml"

permissions:
  contents: read

concurrency:
  group: kairo-staging-d1-inspect
  cancel-in-progress: true

jobs:
  inspect:
    name: Read staging D1 migration journal
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out migration definitions from youtube
        uses: actions/checkout@v6
        with:
          ref: youtube

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: List remote staging D1 migrations (read-only)
        run: npx wrangler d1 migrations list DB --remote --env staging
